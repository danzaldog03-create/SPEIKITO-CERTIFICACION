<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPEIKITO ⚡ AutoCert Workspace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        },
                        dark: '#0f172a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
        }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(226, 232, 240, 0.8);
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <script>

            { id: 6, phase: 'Inicio de la prueba', actor: 'Banco de México', time: '10:00', activity: 'Notificación sobre el inicio de la prueba.', status: null, duration: null, startTime: null, endTime: null },
            { id: 7, phase: 'Conexión al SPID Beta', actor: 'Participantes', time: '10:00 - 10:15', activity: 'Conexión al SPID Beta mediante su cliente.', status: null, duration: null, startTime: null, endTime: null },
            { id: 8, phase: 'Envío de órdenes de pago', actor: 'Participantes', time: '10:15 - 10:40', activity: 'Envío de órdenes de pago a los Participantes.', status: null, duration: null, startTime: null, endTime: null },

            { id: 11, phase: 'Abono de saldos', actor: 'Banco de México', time: '10:40 - 11:00', activity: 'Abono de los saldos del SPID Beta hasta antes de la interrupción en las cuentas en Dólares en SIAC Beta.', status: null, duration: null, startTime: null, endTime: null },

            { id: 13, phase: 'Activación POA-SPID', actor: 'Banco de México', time: '11:02', activity: 'Notificación sobre activación del POA-SPID.', status: null, duration: null, startTime: null, endTime: null },
            { id: 14, phase: 'Activación POA-SPID', actor: 'Participantes', time: '11:02 - 11:20', activity: 'Instrucción de traspasos SIAC al POA-SPID.', status: null, duration: null, startTime: null, endTime: null },
            { id: 15, phase: 'Activación POA-SPID', actor: 'Participantes', time: '11:02 - 11:20', activity: 'Generación de archivos de entrada.', status: null, duration: null, startTime: null, endTime: null },
            { id: 16, phase: 'Activación POA-SPID', actor: 'Participantes', time: '11:02 - 11:20', activity: 'Autenticación en el MRA-SPID.', status: null, duration: null, startTime: null, endTime: null },
            { id: 17, phase: '1er ciclo POA-SPID', actor: 'Banco de México', time: '11:20', activity: 'Notificación inicio 1er ciclo.', status: null, duration: null, startTime: null, endTime: null },
            { id: 18, phase: '1er ciclo POA-SPID', actor: 'Participantes', time: '11:20 - 11:40', activity: 'Depósito de archivos en MRA-SPID (1er ciclo).', status: null, duration: null, startTime: null, endTime: null },
            { id: 19, phase: '1er ciclo POA-SPID', actor: 'Banco de México', time: '11:40', activity: 'Notificación inicio compensación 1er ciclo.', status: null, duration: null, startTime: null, endTime: null },
            { id: 20, phase: '1er ciclo POA-SPID', actor: 'Banco de México', time: '11:40 - 12:00', activity: 'Compensación y liquidación 1er ciclo.', status: null, duration: null, startTime: null, endTime: null },
            { id: 21, phase: '1er ciclo POA-SPID', actor: 'Banco de México', time: '12:00', activity: 'Entrega de resultados 1er ciclo.', status: null, duration: null, startTime: null, endTime: null },
            { id: 22, phase: '1er ciclo POA-SPID', actor: 'Participantes', time: '12:00 - Cierre', activity: 'Descarga de archivo de salida 1er ciclo.', status: null, duration: null, startTime: null, endTime: null },
            { id: 23, phase: '2do ciclo POA-SPID', actor: 'Banco de México', time: '12:05', activity: 'Notificación inicio 2do ciclo.', status: null, duration: null, startTime: null, endTime: null },
            { id: 24, phase: '2do ciclo POA-SPID', actor: 'Participantes', time: '12:05 - 12:25', activity: 'Depósito de archivos en MRA-SPID (2do ciclo).', status: null, duration: null, startTime: null, endTime: null },
            { id: 25, phase: '2do ciclo POA-SPID', actor: 'Banco de México', time: '12:25 - 12:45', activity: 'Compensación y liquidación 2do ciclo.', status: null, duration: null, startTime: null, endTime: null },
            { id: 26, phase: '2do ciclo POA-SPID', actor: 'Banco de México', time: '12:45', activity: 'Entrega de resultados 2do ciclo.', status: null, duration: null, startTime: null, endTime: null },
            { id: 27, phase: '3er ciclo POA-SPID', actor: 'Banco de México', time: '12:50', activity: 'Notificación inicio 3er ciclo (devoluciones).', status: null, duration: null, startTime: null, endTime: null },
            { id: 28, phase: '3er ciclo POA-SPID', actor: 'Participantes', time: '12:50 - 13:10', activity: 'Depósito de archivos en MRA-SPID (3er ciclo).', status: null, duration: null, startTime: null, endTime: null },
            { id: 29, phase: '3er ciclo POA-SPID', actor: 'Banco de México', time: '13:10 - 13:30', activity: 'Compensación y liquidación 3er ciclo.', status: null, duration: null, startTime: null, endTime: null },
            { id: 30, phase: '3er ciclo POA-SPID', actor: 'Banco de México', time: '13:30', activity: 'Entrega de resultados 3er ciclo.', status: null, duration: null, startTime: null, endTime: null },
            { id: 31, phase: 'Liquidación final', actor: 'Banco de México', time: '13:30 - 13:45', activity: 'Traslado de saldos a SIAC Beta.', status: null, duration: null, startTime: null, endTime: null },
            { id: 32, phase: 'Fin de operaciones', actor: 'Banco de México', time: '13:45', activity: 'Fin de operaciones POA-SPID.', status: null, duration: null, startTime: null, endTime: null }
        ];

        // --- GLOBAL STATE ---
        const SPEIKITO = {
            sessions: [], // All saved sessions
            currentSessionId: null, // ID of active session
            currentView: 'session_manager', // session_manager, dashboard, tests, payments, incidents, report, test_runner
            activeTestId: null, // ID of test being executed
            timerInterval: null,

            // Core init
            init() {
                this.loadFromStorage();
                lucide.createIcons();
                this.setupEventListeners();
                
                if (this.sessions.length === 0) {
                    this.renderSessionManager();
                } else if (!this.currentSessionId) {
                    this.renderSessionManager();
                } else {
                    this.renderView('dashboard');
                }
            },

            // --- STORAGE ---
            loadFromStorage() {
                const stored = localStorage.getItem('speikito_data');
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        this.sessions = parsed.sessions || [];
                        this.currentSessionId = parsed.currentSessionId;
                    } catch (e) {
                        console.error("Error loading data", e);
                    }
                }
            },
            saveToStorage() {
                localStorage.setItem('speikito_data', JSON.stringify({
                    sessions: this.sessions,
                    currentSessionId: this.currentSessionId
                }));
                this.updateBadges();
            },
            exportData() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({sessions: this.sessions}));
                const dlAnchorElem = document.createElement('a');
                dlAnchorElem.setAttribute("href", dataStr);
                dlAnchorElem.setAttribute("download", `speikito_backup_${new Date().getTime()}.json`);
                dlAnchorElem.click();
            },

            // --- HELPERS ---
            getSession() {
                return this.sessions.find(s => s.id === this.currentSessionId);
            },
            logEvent(type, description, refId = null) {
                const session = this.getSession();
                if (!session) return;
                session.logs.push({
                    id: Date.now().toString(),
                    date: new Date().toISOString(),
                    type,
                    description,
                    refId
                });
                this.saveToStorage();
            },
            formatDate(isoString) {
                if (!isoString) return '--';
                const d = new Date(isoString);
                return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
            },
            formatTime(isoString) {
                if (!isoString) return '--:--';
                const d = new Date(isoString);
                return d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            },
            formatDuration(seconds) {
                if(seconds === null || isNaN(seconds)) return '--';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}m ${s}s`;
            },
            getNextPendingTest() {
                const session = this.getSession();
                if (!session) return null;
                return session.tests.find(t => t.status === null || t.status === 'in_progress');
            },

            // --- WHATSAPP & CSV LOGIC ---
            sendToWhatsApp(testId) {
                const session = this.getSession();
                if (!session) return;
                const test = session.tests.find(t => t.id === testId);
                if (!test || !test.status) return alert("Primero finaliza la prueba.");

                // Buscar observaciones (ya sea de incidencias o de notas de evidencia)
                let observation = "";
                let escalated = false;
                if (test.status === 'failed') {
                    const incident = session.incidents.find(i => i.testId === testId);
                    if (incident) {
                        observation = incident.description;
                        escalated = incident.escalated;
                    }
                } else {
                    const note = session.evidences.find(e => e.testId === testId && e.type === 'nota');
                    if (note) observation = note.value;
                }

                const timeToUse = test.endTime ? new Date(test.endTime) : new Date();
                const dateStr = timeToUse.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const timeStr = timeToUse.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });

                let msg = `🗓 Fecha: ${dateStr}\n`;
                msg += `⏰ Hora: ${timeStr}\n\n`;
                msg += `✅ Prueba:\n${session.name}\n\n`;

                const phaseText = test.phase ? `[${test.phase}] ` : '';
                const actorText = test.actor ? `(${test.actor}) ` : '';

                msg += `🔢 ID ${test.id} ${phaseText}${actorText}\n👉 ${test.activity}\n\n`;

                if (test.status === 'success') {
                  msg += `📝 Observaciones:\n✅ Exitoso${observation.trim() ? `\n📌 Nota: ${observation}` : ''}\n\n`;
                } else if (test.status === 'failed') {
                  msg += `📝 Observaciones:\n❌ ${observation || 'Sin observaciones detalladas'}\n`;
                  msg += `⚠️ Escalado: ${escalated ? 'Sí' : 'No'}\n\n`;
                }

                msg += `👤 Responsable: ${session.responsible}`;

                window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
            },

            downloadCSVTemplate() {
                const headers = "Fase,Actor,Horario,Actividad\n";
                const sample = "Fondeo,Banco de México,15:00 - 15:30,Fondeo de los Participantes en su cuenta en Dólares\n";
                const blob = new Blob(["\uFEFF" + headers + sample], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "Plantilla_SPEIKITO.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            },

            handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const lines = text.split('\n');
                    const parsedTests = [];
                    const session = this.getSession();
                    let currentId = session.tests.length > 0 ? Math.max(...session.tests.map(t => t.id)) + 1 : 1;

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        
                        // Parseo básico de CSV ignorando comas entre comillas
                        const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
                        const parts = line.split(regex).map(val => val.replace(/^"|"$/g, '').trim());

                        const activity = parts[3] || parts[0];
                        if (!activity) continue;

                        parsedTests.push({
                            id: currentId++,
                            phase: parts.length > 3 ? parts[0] : '',
                            actor: parts.length > 3 ? parts[1] : '',
                            time: parts.length > 3 ? parts[2] : '',
                            activity: activity,
                            status: null, duration: null, startTime: null, endTime: null
                        });
                    }

                    if (parsedTests.length > 0) {
                        const replace = confirm(`Se encontraron ${parsedTests.length} actividades.\n\n¿Deseas REEMPLAZAR el guion actual? (Si cancelas, se AGREGARÁN al final).`);
                        if (replace) {
                            session.tests = parsedTests;
                        } else {
                            session.tests = [...session.tests, ...parsedTests];
                        }
                        this.logEvent('CSV_LOADED', `Carga masiva de ${parsedTests.length} pruebas.`);
                        this.saveToStorage();
                        this.renderView('tests');
                        alert("¡Pruebas cargadas correctamente!");
                    } else {
                        alert('No se encontraron actividades válidas en el archivo.');
                    }
                };
                reader.readAsText(file);
                event.target.value = null; // Reset input
            },

            // --- VIEW ROUTING ---
            renderView(view) {
                this.currentView = view;
                const container = document.getElementById('app-container');
                container.innerHTML = '';
                
                // Update Desktop Layout Margin
                if(view === 'session_manager') {
                    document.getElementById('main-scroll-area').classList.remove('sm:ml-64');
                    document.querySelector('aside').classList.add('hidden');
                    document.querySelector('aside').classList.remove('sm:flex');
                } else {
                    document.getElementById('main-scroll-area').classList.add('sm:ml-64');
                    document.querySelector('aside').classList.remove('hidden');
                    document.querySelector('aside').classList.add('sm:flex');
                }

                // Update active nav state
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('text-primary-600', 'bg-slate-100');
                    if(btn.dataset.view === view) {
                        if(btn.classList.contains('active-nav-desktop')){
                           btn.classList.add('text-primary-600', 'bg-slate-100');
                        } else {
                           btn.classList.add('text-primary-600');
                        }
                    }
                });

                const session = this.getSession();
                if (session) {
                    document.getElementById('header-session-name').textContent = session.name;

                this.updateBadges();

                switch(view) {

                    case 'payments': this.renderPayments(); break;

                const bPending = document.getElementById('badge-pending');
                const bPendingD = document.getElementById('badge-pending-desktop');

                    bPending.textContent = pending; bPending.classList.remove('hidden');
                    bPendingD.textContent = pending; bPendingD.classList.remove('hidden');

                    bPending.classList.add('hidden'); bPendingD.classList.add('hidden');

                const bInc = document.getElementById('badge-incidents');
                const bIncD = document.getElementById('badge-incidents-desktop');

                    bInc.textContent = activeIncidents; bInc.classList.remove('hidden');

            createSession() {
                const name = document.getElementById('new-sess-name').value.trim();

                const template = document.getElementById('new-sess-template').value;

                if(!name) return alert("Ingresa un nombre");

                const newSession = {
                    id: 'sess_' + Date.now(),
                    name,
                    responsible: resp,
                    createdAt: new Date().toISOString(),
                    status: 'active', // active, completed
                    tests: template === 'poa_spid' ? JSON.parse(JSON.stringify(DEFAULT_POA_SPID)) : [],
                    incidents: [],
                    evidences: [],
                    payments: [],
                    logs: []
                };

                this.sessions.push(newSession);
                this.currentSessionId = newSession.id;
                this.saveToStorage();
                this.logEvent('SESSION_CREATED', 'Sesión creada y activada.');
                
                document.getElementById('modal-create').remove();
                this.renderView('dashboard');
            },

            openSession(id) {
                this.currentSessionId = id;

                    if(this.currentSessionId === id) this.currentSessionId = null;
                    this.saveToStorage();
                    this.renderSessionManager();
                }

            // --- VIEW: TEST RUNNER (LIVE MODE) ---
            startTestRunner(testId) {
                this.activeTestId = testId;
                const session = this.getSession();
                const test = session.tests.find(t => t.id === testId);
                
                this.renderView('test_runner');
                
                // Solo inicia el cronómetro visual si ya estaba en curso
                if (test.status === 'in_progress') {
                    this.startTimer();
                }
            },

            startTestAction() {
                const session = this.getSession();
                const test = session.tests.find(t => t.id === this.activeTestId);
                if(!test) return;

                test.startTime = new Date().toISOString();
                test.lastResumeTime = test.startTime;
                test.accumulatedTime = 0;
                test.status = 'in_progress';
                
                this.logEvent('TEST_STARTED', `Inició ejecución de prueba ID ${test.id}`, test.id);
                this.saveToStorage();
                
                this.renderView('test_runner');
                this.startTimer();
            },

            pauseTest() {
                const session = this.getSession();
                const test = session.tests.find(t => t.id === this.activeTestId);
                if(!test || test.status !== 'in_progress') return;

                clearInterval(this.timerInterval);
                const now = new Date().getTime();
                const start = new Date(test.lastResumeTime).getTime();
                
                test.accumulatedTime = (test.accumulatedTime || 0) + Math.floor((now - start) / 1000);
                test.status = 'paused';
                
                this.logEvent('TEST_PAUSED', `Pausó ejecución de prueba ID ${test.id}`, test.id);
                this.saveToStorage();
                this.renderView('test_runner');
            },

            resumeTest() {
                const session = this.getSession();
                const test = session.tests.find(t => t.id === this.activeTestId);
                if(!test || test.status !== 'paused') return;

                test.lastResumeTime = new Date().toISOString();
                test.status = 'in_progress';
                
                this.logEvent('TEST_RESUMED', `Reanudó ejecución de prueba ID ${test.id}`, test.id);
                this.saveToStorage();
                this.renderView('test_runner');
                this.startTimer();
            },

            startTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                const timerEl = document.getElementById('live-timer');
                if(!timerEl) return;

                const session = this.getSession();
                const test = session.tests.find(t => t.id === this.activeTestId);
                if(!test || test.status !== 'in_progress' || !test.lastResumeTime) return;

                this.timerInterval = setInterval(() => {
                    const now = new Date().getTime();
                    const start = new Date(test.lastResumeTime).getTime();
                    const diff = Math.floor((now - start) / 1000);
                    const total = (test.accumulatedTime || 0) + diff;
                    
                    if(document.getElementById('live-timer')) {
                         document.getElementById('live-timer').textContent = this.formatDuration(total);
                    } else {
                        clearInterval(this.timerInterval);
                    }
                }, 1000);
            },

            finishTest(status) {
                const session = this.getSession();
                const test = session.tests.find(t => t.id === this.activeTestId);
                if(!test) return;

                clearInterval(this.timerInterval);
                test.endTime = new Date().toISOString();
                
                // Calcular tiempo final si estaba corriendo
                if (test.status === 'in_progress' && test.lastResumeTime) {
                    const start = new Date(test.lastResumeTime).getTime();
                    const end = new Date(test.endTime).getTime();
                    test.accumulatedTime = (test.accumulatedTime || 0) + Math.floor((end - start) / 1000);
                }
                
                test.duration = test.accumulatedTime || 0;
                test.status = status;

                if (status === 'success') {
                    this.logEvent('TEST_SUCCESS', `Prueba ID ${test.id} completada exitosamente.`, test.id);
                    this.saveToStorage();
                    this.showEvidenceModal(test.id, true); // Opcional agregar nota
                } else {
                    // Si falla, abrimos el modal de incidencia obligatorio
                    this.logEvent('TEST_FAILED', `Prueba ID ${test.id} fallida.`, test.id);
                    this.saveToStorage();
                    this.showIncidentModal(test.id);
                }
            },

            renderTestRunner() {
                const session = this.getSession();
                const test = session.tests.find(t => t.id === this.activeTestId);
                if(!test) return this.renderView('dashboard');

                let initialDuration = '0m 0s';
                if(test.endTime) {
                    initialDuration = this.formatDuration(test.duration);
                } else if (test.accumulatedTime !== undefined || test.lastResumeTime) {
                    let total = test.accumulatedTime || 0;
                    if (test.status === 'in_progress' && test.lastResumeTime) {
                        const now = new Date().getTime();
                        const start = new Date(test.lastResumeTime).getTime();
                        total += Math.floor((now - start) / 1000);
                    }
                    initialDuration = this.formatDuration(total);
                }

                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="fade-in max-w-2xl mx-auto h-full flex flex-col">
                        <div class="flex items-center justify-between mb-6">
                            <button onclick="SPEIKITO.renderView('tests')" class="text-slate-500 hover:text-slate-800 flex items-center gap-1 font-medium">
                                <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver
                            </button>
                            <span class="bg-primary-100 text-primary-700 px-3 py-1 rounded-full text-xs font-bold tracking-widest border border-primary-200">
                                ID ${test.id}
                            </span>
                        </div>

                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-6 flex-1">
                            <div class="text-center mb-8">
                                <div class="inline-flex items-center justify-center px-4 py-2 bg-slate-900 text-white rounded-xl mb-6 shadow-inner font-mono text-2xl tracking-wider min-w-[150px] relative">
                                    <i data-lucide="timer" class="w-5 h-5 mr-2 text-slate-400"></i>
                                    <span id="live-timer">${initialDuration}</span>
                                    ${test.status === 'paused' ? '<span class="absolute -top-2 -right-2 bg-orange-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full animate-pulse">PAUSADO</span>' : ''}
                                </div>
                                <h2 class="text-2xl font-bold text-slate-800 leading-tight mb-4">${test.activity}</h2>
                                
                                <div class="flex flex-wrap justify-center gap-2 text-xs font-medium">

            // --- VIEW: REPORT & BITACORA ---
            renderReport() {
                const session = this.getSession();
                const container = document.getElementById('app-container');
                
                const total = session.tests.length;
                const success = session.tests.filter(t => t.status === 'success').length;
                const failed = session.tests.filter(t => t.status === 'failed').length;
                
                let reportText = `====== REPORTE: ${session.name.toUpperCase()} ======\n`;
                reportText += `Responsable: ${session.responsible}\n`;
                reportText += `Fecha: ${this.formatDate(session.createdAt)}\n`;
                reportText += `-------------------------------------------\n`;
                reportText += `AVANCE GENERAL: ${total > 0 ? Math.round((success/total)*100) : 0}%\n`;
                reportText += `Exitosas: ${success} | Fallidas: ${failed} | Pendientes: ${total - success - failed}\n`;
                reportText += `-------------------------------------------\n`;
                
                if(failed > 0) {
                    reportText += `\n* INCIDENCIAS REGISTRADAS:\n`;
                    session.incidents.forEach(inc => {
                        reportText += `- [${inc.status}] ID Prueba ${inc.testId}: ${inc.description}\n`;
                    });
                }

                reportText += `\n* BITÁCORA DE EVENTOS:\n`;
                [...session.logs].forEach(log => {
                    reportText += `[${this.formatTime(log.date)}] ${log.description}\n`;
                });

                const html = `
                    <div class="fade-in space-y-4 h-full flex flex-col">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center flex-none">
                            <h2 class="text-xl font-bold text-slate-800">Reporte Final</h2>
                            <button onclick="SPEIKITO.copyReport()" class="flex items-center gap-2 bg-primary-50 text-primary-600 hover:bg-primary-100 px-3 py-1.5 rounded-lg text-sm font-bold transition-colors border border-primary-200">
                                <i data-lucide="copy" class="w-4 h-4"></i> Copiar
                            </button>
                        </div>

                        <div class="bg-slate-900 rounded-2xl shadow-inner p-4 flex-1 overflow-y-auto relative">
                            <pre id="report-content" class="text-green-400 font-mono text-[10px] sm:text-xs whitespace-pre-wrap leading-relaxed">${reportText}</pre>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            },
            copyReport() {
                const text = document.getElementById('report-content').innerText;
                
                // Usamos un textarea temporal invisible para evitar restricciones del iFrame
                const textArea = document.createElement("textarea");
                textArea.value = text;
                
                // Evitamos que la pantalla haga un salto (scroll) al crear el elemento
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        alert('Reporte copiado al portapapeles.');
                    } else {
                        alert('No se pudo copiar el reporte.');
                    }
                } catch (err) {
                    console.error('Error al intentar copiar', err);
                    alert('Error al copiar. Por favor selecciona el texto manualmente.');
                }
                
                document.body.removeChild(textArea);
            },

            saveIncident(testId) {
                const desc = document.getElementById('inc-desc').value.trim();
                if(!desc) return alert("La descripción es obligatoria.");

                const session = this.getSession();
                const newInc = {
                    id: Math.floor(Math.random() * 10000).toString(),
                    testId,
                    date: new Date().toISOString(),
                    description: desc,
                    severity: document.getElementById('inc-sev').value,
                    escalated: document.getElementById('inc-esc').checked,
                    status: 'Abierta'
                };
                session.incidents.push(newInc);
                this.logEvent('INCIDENT_CREATED', `Incidencia reportada en prueba ${testId}: ${desc}`, newInc.id);
                this.saveToStorage();
                
                document.getElementById('modal-incident').remove();
                this.renderView('dashboard'); // Return to flow
            },
            updateIncidentStatus(incId, status) {
                const session = this.getSession();
                const inc = session.incidents.find(i => i.id === incId);
                if(inc) {
                    inc.status = status;
                    this.logEvent('INCIDENT_UPDATED', `Incidencia ${incId} cambió a ${status}.`, incId);
                    this.saveToStorage();
                    this.renderIncidents();
                }
            },

            showEvidenceModal(testId, fromSuccess = false) {
                const session = this.getSession();
                const evs = session.evidences.filter(e => e.testId === testId);
                
                let evListHtml = evs.map(e => `
                    <div class="flex items-center justify-between bg-white p-2 rounded border border-slate-200 mb-2">
                        <div class="flex items-center gap-2 text-sm">
                            <i data-lucide="${e.type === 'nota' ? 'file-text' : 'image'}" class="w-4 h-4 text-slate-400"></i>
                            <span class="truncate max-w-[200px]">${e.value}</span>
                        </div>
                        <button onclick="SPEIKITO.deleteEvidence('${e.id}', ${testId})" class="text-red-400 hover:text-red-600"><i data-lucide="trash" class="w-4 h-4"></i></button>
                    </div>
                `).join('');

                const modalHtml = `
                    <div id="modal-evidence" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
                        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                            <div class="bg-slate-50 p-4 border-b border-slate-100 flex justify-between items-center">
                                <h3 class="font-bold text-slate-800 flex items-center gap-2"><i data-lucide="paperclip" class="w-5 h-5 text-primary-500"></i> Evidencias ID ${testId}</h3>
                                ${!fromSuccess ? `<button onclick="document.getElementById('modal-evidence').remove()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>` : ''}
                            </div>
                            <div class="p-5">
                                <div class="mb-4">
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Agregar Nota / Referencia</label>
                                    <div class="flex gap-2">
                                        <input type="text" id="ev-note" class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" placeholder="Escribe una observación...">
                                        <button onclick="SPEIKITO.addEvidence(${testId}, 'nota')" class="bg-slate-800 text-white px-3 rounded-lg"><i data-lucide="plus" class="w-4 h-4"></i></button>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Simular Archivo (Solo Nombre)</label>
                                     <div class="flex gap-2">
                                        <input type="text" id="ev-file" class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none text-sm" placeholder="ej. captura_pantalla.png">
                                        <button onclick="SPEIKITO.addEvidence(${testId}, 'archivo')" class="bg-slate-800 text-white px-3 rounded-lg"><i data-lucide="upload" class="w-4 h-4"></i></button>
                                    </div>
                                    <p class="text-[10px] text-slate-400 mt-1">* Por límites de memoria local, solo guardamos la referencia.</p>
                                </div>
                                
                                <div class="mt-4 pt-4 border-t border-slate-100">
                                    <h4 class="text-xs font-bold text-slate-500 uppercase mb-2">Registradas (${evs.length})</h4>
                                    <div class="max-h-32 overflow-y-auto" id="ev-list-container">
                                        ${evListHtml || '<p class="text-sm text-slate-400 italic">No hay evidencias</p>'}
                                    </div>
                                </div>
                            </div>
                            <div class="p-4 bg-slate-50 border-t border-slate-100 flex justify-end">
                                <button onclick="document.getElementById('modal-evidence').remove(); ${fromSuccess ? "SPEIKITO.renderView('dashboard')" : ""}" class="px-6 py-2 bg-primary-600 text-white font-bold rounded-xl hover:bg-primary-700 shadow-sm">
                                    ${fromSuccess ? 'Continuar' : 'Cerrar'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                const container = document.getElementById('modals-container');
                container.innerHTML = modalHtml;
                lucide.createIcons();
            },
            addEvidence(testId, type) {
                const inputId = type === 'nota' ? 'ev-note' : 'ev-file';
                const el = document.getElementById(inputId);
                const val = el.value.trim();
                if(!val) return;

                const session = this.getSession();
                session.evidences.push({
                    id: 'ev_' + Date.now(),
                    testId,
                    type,
                    value: val,
                    date: new Date().toISOString()
                });
                
                this.logEvent('EVIDENCE_ADDED', `Evidencia (${type}) agregada a prueba ${testId}.`, testId);
                this.saveToStorage();
                el.value = '';
                
                // Re-render modal to show new item
                this.showEvidenceModal(testId, false); 
            },
            deleteEvidence(evId, testId) {
                const session = this.getSession();
                session.evidences = session.evidences.filter(e => e.id !== evId);
                this.saveToStorage();
                this.showEvidenceModal(testId, false);
            },

            showPaymentModal() {
                 const modalHtml = `
                    <div id="modal-payment" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
                        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                            <div class="bg-slate-50 p-4 border-b border-slate-100 flex justify-between items-center">
                                <h3 class="font-bold text-slate-800">Registrar Pago</h3>
                                <button onclick="document.getElementById('modal-payment').remove()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                            </div>
                            <div class="p-5 space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Concepto</label>
                                    <input type="text" id="pay-desc" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none" placeholder="Ej. Fondeo inicial">
                                </div>
                                <div class="flex gap-3">
                                     <div class="flex-1">
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Tipo</label>
                                        <select id="pay-type" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none bg-white">
                                            <option value="Enviado">Enviado</option>
                                            <option value="Recibido">Recibido</option>
                                        </select>
                                    </div>
                                    <div class="flex-1">
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Monto ($)</label>
                                        <input type="number" id="pay-amt" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none" placeholder="0.00">
                                    </div>
                                </div>
                                 <div class="flex gap-3">
                                     <div class="flex-1">
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Ops.</label>
                                        <input type="number" id="pay-ops" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none" value="1">
                                    </div>
                                    <div class="flex-1">
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">ID Ref (Opcional)</label>
                                        <input type="text" id="pay-ref" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none" placeholder="Ej. 14">
                                    </div>
                                </div>
                            </div>
                            <div class="p-4 bg-slate-50 border-t border-slate-100 flex justify-end">
                                <button onclick="SPEIKITO.savePayment()" class="px-6 py-2 bg-primary-600 text-white font-bold rounded-xl hover:bg-primary-700 shadow-sm">
                                    Guardar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modals-container').innerHTML = modalHtml;
                lucide.createIcons();
            },
            savePayment() {
                const desc = document.getElementById('pay-desc').value.trim();
                const amt = parseFloat(document.getElementById('pay-amt').value) || 0;
                if(!desc) return alert("Concepto requerido");

                const session = this.getSession();
                session.payments.push({
                    id: 'pay_' + Date.now(),
                    description: desc,
                    type: document.getElementById('pay-type').value,
                    amount: amt,
                    operations: parseInt(document.getElementById('pay-ops').value) || 1,
                    activityRef: document.getElementById('pay-ref').value,
                    status: 'Completado'
                });

                this.logEvent('PAYMENT_ADDED', `Pago registrado: ${desc} ($${amt})`);
                this.saveToStorage();
                document.getElementById('modal-payment').remove();
                this.renderPayments();
            }
        };

        // Initialize App on DOM Content Loaded
        document.addEventListener('DOMContentLoaded', () => {
            SPEIKITO.init();
        });

    </script>
</body>
</html>
